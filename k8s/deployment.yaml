apiVersion: apps/v1
kind: Deployment
metadata:
  name: consearch-backend
  namespace: consearch
  labels:
    app: consearch
    component: backend
    tier: application
spec:
  replicas: 3  # Start with 3 replicas untuk high availability
  revisionHistoryLimit: 5  # Keep 5 revisions untuk rollback
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Tambah max 1 pod saat update
      maxUnavailable: 0  # Jangan matikan pod sampai yang baru ready
  selector:
    matchLabels:
      app: consearch
      component: backend
  template:
    metadata:
      labels:
        app: consearch
        component: backend
        tier: application
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Anti-affinity agar pod tidak berada di node yang sama
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      
      # Init container untuk wait database ready
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command: 
        - 'sh'
        - '-c'
        - |
          until nc -z postgres 5432; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      
      containers:
      - name: backend
        image: consearch-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        
        # Environment variables
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: consearch-config
              key: db_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: consearch-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: consearch-secrets
              key: db_password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: consearch-secrets
              key: jwt_secret
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: consearch-secrets
              key: session_secret
        
        # Resource requests and limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"       # 0.2 CPU cores
          limits:
            memory: "512Mi"
            cpu: "500m"       # 0.5 CPU cores
        
        # Liveness probe - restart jika unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Readiness probe - traffic hanya ke pod yang ready
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        
        # Startup probe - untuk aplikasi yang butuh waktu start lama
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30  # Tunggu max 150 detik (30 * 5s)
        
        # Volume mounts jika ada
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: app-logs
        emptyDir: {}
      
      # Service account
      serviceAccountName: consearch-backend
      
      # Restart policy
      restartPolicy: Always
      
      # DNS policy
      dnsPolicy: ClusterFirst
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consearch-backend
  namespace: consearch
  labels:
    app: consearch
    component: backend
